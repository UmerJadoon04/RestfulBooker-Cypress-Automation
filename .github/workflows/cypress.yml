name: Cypress Tests

# This workflow runs automatically:
# - every time code is pushed to the main branch
# - every time a Pull Request is opened against main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (needed to run Cypress and npm)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run all Cypress tests headlessly (no visible browser window)
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      # Step 5: If any test fails, save a screenshot as proof (helps debugging)
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots